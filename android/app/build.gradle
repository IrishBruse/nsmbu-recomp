

plugins {
    id 'com.android.application'
}

android {
    namespace = "org.nsmbrecomp.nsmbu"
    compileSdk 36
    buildToolsVersion "35.0.0"
    ndkVersion "30.0.16248370"
    defaultConfig {
        applicationId "org.nsmbrecomp.nsmbu"
        minSdk 33
        targetSdk 36
        versionCode 1
        versionName "0.1"
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    sourceSets.main.jniLibs.srcDirs = ['libs']

    def gameIcon = file('local-res').exists()
    if (gameIcon) sourceSets.main.res.srcDirs += ['local-res']
    defaultConfig.manifestPlaceholders = [appIcon: gameIcon ? '@mipmap/ic_game' : '@mipmap/ic_launcher']
    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += ['**/libmain.so']
        }
    }
    lint { abortOnError = false }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
